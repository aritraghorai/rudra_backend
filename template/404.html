<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - 404</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
            text-align: center;
        }

        .error-code {
            font-size: 120px;
            font-weight: bold;
            color: #2d3748;
            line-height: 1;
            margin-bottom: 1rem;
            opacity: 0.8;
        }

        .error-message {
            font-size: 24px;
            margin-bottom: 1.5rem;
            color: #4a5568;
        }

        .error-description {
            color: #718096;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .back-button {
            display: inline-block;
            padding: 12px 24px;
            background-color: #4299e1;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .back-button:hover {
            background-color: #3182ce;
        }

        @media (max-width: 640px) {
            .container {
                padding: 1rem;
            }
            
            .error-code {
                font-size: 80px;
            }
            
            .error-message {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <h1 class="error-message">Page Not Found</h1>
        <p class="error-description">
            The page you're looking for doesn't exist or has been moved.
            Please check the URL or navigate back to the homepage.
        </p>
        <a href="{% url 'admin_login' %}" class="back-button">Back to Homepage</a>
    </div>
</body>
</html>

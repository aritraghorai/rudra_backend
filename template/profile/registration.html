<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <title>Purple Admin</title>
    <!-- plugins:css -->
    <link
      rel="stylesheet"
      href="{% static 'admin/assets/vendors/mdi/css/materialdesignicons.min.css' %}"
    />
    <link
      rel="stylesheet"
      href="{% static 'admin/assets/vendors/css/vendor.bundle.base.css' %}"
    />
    <link rel="stylesheet" href="{% static 'admin/assets/css/style.css' %}" />
    <link
      rel="shortcut icon"
      href="{% static 'admin/assets/images/favicon.ico' %}"
    />
  </head>
  <body>
      <div class="container-scroller">
    <div class="container-fluid page-body-wrapper full-page-wrapper">
      <div class="content-wrapper d-flex align-items-center auth">
        <div class="row flex-grow">
          <div class="col-lg-4 mx-auto">
            <div class="auth-form-light text-left p-5">
              <div class="brand-logo">
                <!-- <h3 class="display-4" style="color: purple;">DBMS Login Page</h3> -->
                  <h1 class="logo">
                    <img src="{% static 'customer/images/alvreo-b.png' %}" alt="">
                  </h1>
      
              </div>
              <h4>Admin SignIn</h4>
              <h6 class="font-weight-light">Sign in to continue.</h6>
              <form class="pt-3"  method='POST' action="{% url 'register' %}">
                  {% csrf_token %}
                  {% include 'auth_temp/alert-msg.html' %}
                <div class="form-group">
                  <input type="text" class="form-control form-control-lg" id="username" name='username' placeholder="Mohapatra1998" aria-describedby="emailHelp" required autocomplete="off">
                </div>
                <div class="form-group">
                  <input type="password" class="form-control form-control-lg" id="pwd1" name='password1' placeholder="************" required autocomplete="off">
                </div>
                <div class="form-group">
                    <input type="password" class="form-control form-control-lg" id="pwd2" name='password2' placeholder="**********" required autocomplete="off">
                  </div>
                <div class="mt-3">
                  <button type="submit" class="btn btn-block btn-gradient-primary btn-lg font-weight-medium auth-form-btn">Restration</button>
                </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
      <!-- content-wrapper ends -->
    </div>
    <!-- page-body-wrapper ends -->
    <script src="{% static 'admin/assets/vendors/js/vendor.bundle.base.js' %}"></script>
    <!-- inject:js -->
    <script src="{% static 'admin/assets/js/off-canvas.js' %}"></script>
    <script src="{% static 'admin/assets/js/hoverable-collapse.js' %}"></script>
    <script src="{% static 'admin/assets/js/misc.js' %}"></script>
  </body>
</html>
